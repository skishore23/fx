name: Structural search evidence
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: python -m research.structural_search.verify_artifact
      - run: python -m unittest research.structural_search.test_engine -v
      - run: node research/structural_search/verify-fx.cjs
      - run: node research/structural_search/fx-memory.cjs
